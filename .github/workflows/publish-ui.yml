name: Publish the web UI

# Attaches the multi-tenant server's web UI (packages/docket-ui/cloud), packed
# for hosting on its own, to the GitHub release of a `docket-cloud-ui-v<version>`
# tag. The tag must match the version in its package.json. The server bundles
# the same files, so this is only for a UI hosted apart from its server; its
# manifest names the API version it needs, which the host checks at start.

on:
  push:
    tags: ['docket-cloud-ui-v*']

permissions:
  contents: write # the release's assets

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/docket-ui/cloud/package.json').version")
          if [ "$GITHUB_REF_NAME" != "docket-cloud-ui-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docket/cloud-ui build
      - run: pnpm --filter @docket/cloud-ui test
      - run: pnpm --filter @docket/cloud-ui pack:standalone

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "The web UI, packed for hosting on its own (packages/docket-ui/cloud/README.md)."
          gh release upload "$GITHUB_REF_NAME" packages/docket-ui/cloud/dist/*.tgz --clobber
