name: Publish docket-server

# Publishes @chrisjowen/docket-server to npm when a `docket-server-v<version>`
# tag is pushed - directly, or by publishing a GitHub release that creates
# the tag. The tag must match the version in packages/server/package.json.
#
# As with @chrisjowen/docket (publish.yml), it authenticates with npm trusted
# publishing (GitHub OIDC; this repository and workflow are the package's
# trusted publisher on npmjs.com), so no token or 2FA approval is needed, and
# the same OIDC token signs provenance. An NPM_TOKEN repository secret is the
# fallback.

on:
  push:
    tags: ['docket-server-v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # docket-server's store suites and the Postgres adapter's run against a real Postgres; in CI they fail rather
    # than skip without one. The image is Postgres 17 with pgvector, so the adapter's semantic suites run too.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOCKET_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          if [ "$GITHUB_REF_NAME" != "docket-server-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      # The API surface test reads the built declarations, and docket-server
      # typechecks against docket's, so build first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1

      - name: Publish
        working-directory: packages/server
        env:
          # Only used when trusted publishing is not configured for this repository.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
