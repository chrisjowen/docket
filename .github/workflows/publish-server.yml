name: Publish docket-server

# Stages @chrisjowen/docket-server on npm when a `docket-server-v<version>`
# tag is pushed - directly, or by publishing a GitHub release that creates
# the tag. The tag must match the version in packages/server/package.json.
#
# As with @chrisjowen/docket (publish.yml), npm does not allow publishing
# from CI without 2FA, so this runs `npm stage publish` and a maintainer
# approves the staged version with 2FA via `npm stage approve <stage-id>` or
# the Staged Packages tab on npmjs.com.
#
# Authentication is the NPM_TOKEN repository secret (an npm token with publish
# rights); the OIDC token signs provenance.

on:
  push:
    tags: ['docket-server-v*']

permissions:
  contents: read
  id-token: write # OIDC for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          if [ "$GITHUB_REF_NAME" != "docket-server-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      # The API surface test reads the built declarations, and docket-server
      # typechecks against docket's, so build first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # Staged publishing needs npm 11.15.0 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.15.0

      - name: Stage
        working-directory: packages/server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --provenance --access public
