name: Image

# ghcr.io/chrisjowen/docket, docket serve's image (deploy/image/Dockerfile),
# and the Compose and Helm files that run it (deploy/).
#
# On every pull request and push to main: check the chart and the Compose
# files (deploy/test/check.mjs), build the image for linux/amd64, and run
# docket serve's gates against it under Compose (no database, then the
# postgres profile and multi-tenant mode) and the Helm chart on a kind cluster.
# Nothing is pushed.
#
# On a `v<version>` tag - the tag publish.yml publishes docket to npm from - it
# does the same, then builds linux/amd64 and linux/arm64 and pushes them to
# GHCR as <version>, <major>.<minor> and latest. The tag must match
# packages/docket/package.json, which the chart and Compose name too.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/chrisjowen/docket

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.2
      - run: node deploy/test/check.mjs

  smoke:
    runs-on: ubuntu-latest
    env:
      DOCKET_IMAGE: ghcr.io/chrisjowen/docket:ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/Dockerfile
          load: true
          tags: ${{ env.DOCKET_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose, no database
        run: deploy/test/compose-e2e.sh
      - name: Compose, the postgres profile
        run: deploy/test/compose-e2e.sh postgres
      - name: Compose, the multi-tenant profile
        run: deploy/test/platform-smoke.sh compose
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.2
      - uses: helm/kind-action@v1
        with:
          cluster_name: docket-smoke
      - name: Helm on kind, no database
        run: deploy/test/kind-smoke.sh
        env:
          DOCKET_SMOKE_CLUSTER: docket-smoke
      - name: Helm on kind, the bundled Postgres
        run: deploy/test/kind-smoke.sh postgres
        env:
          DOCKET_SMOKE_CLUSTER: docket-smoke

      - name: Helm on kind, the multi-tenant profile
        run: deploy/test/platform-smoke.sh helm
        env:
          DOCKET_SMOKE_CLUSTER: docket-smoke

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/docket/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          provenance: true
          sbom: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
