name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # docket-server's store suites and the Postgres adapter's run against a real Postgres; in CI they fail rather
    # than skip without one. The image is Postgres 17 with pgvector, so the adapter's semantic suites run too.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOCKET_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docket-server typechecks against docket's built declarations, so build first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # The web UI's standalone artifact: the same files the server bundles, versioned, for hosting on its own.
      - run: pnpm --filter @docket/cloud-ui pack:standalone
      - uses: actions/upload-artifact@v4
        with:
          name: docket-cloud-ui
          path: packages/docket-ui/cloud/dist/*.tgz
          if-no-files-found: error

  # The server platform's *.int.test.ts suites, against a real Postgres, Neo4j and Qdrant.
  platform-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
          NEO4J_server_memory_heap_max__size: 256m
          NEO4J_server_memory_pagecache_size: 256m
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-password 'RETURN 1'" --health-interval 5s --health-timeout 10s --health-retries 30
      qdrant:
        image: qdrant/qdrant:v1.18.3
        env:
          QDRANT__SERVICE__API_KEY: ci-qdrant-key
          QDRANT__SERVICE__JWT_RBAC: 'true'
        ports: ['6333:6333']
    env:
      DOCKET_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DOCKET_TEST_NEO4J_URL: bolt://127.0.0.1:7687
      DOCKET_TEST_NEO4J_PASSWORD: ci-neo4j-password
      DOCKET_TEST_QDRANT_URL: http://127.0.0.1:6333
      DOCKET_TEST_QDRANT_API_KEY: ci-qdrant-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:integration

  # The server platform's Playwright suite, against its production build, a real Postgres, two Neo4j
  # (one per account, for the isolation suite) and Qdrant, with the worker running.
  platform-e2e:
    runs-on: ubuntu-latest
    container:
      # Keep in sync with @playwright/test in platform/package.json; browsers and OS deps are bundled.
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
          NEO4J_server_memory_heap_max__size: 256m
          NEO4J_server_memory_pagecache_size: 256m
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-password 'RETURN 1'" --health-interval 5s --health-timeout 10s --health-retries 30
      neo4j-b:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password-b
          NEO4J_server_memory_heap_max__size: 256m
          NEO4J_server_memory_pagecache_size: 256m
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-password-b 'RETURN 1'" --health-interval 5s --health-timeout 10s --health-retries 30
      qdrant:
        image: qdrant/qdrant:v1.18.3
        env:
          QDRANT__SERVICE__API_KEY: ci-qdrant-key
          QDRANT__SERVICE__JWT_RBAC: 'true'
    env:
      DOCKET_TEST_PG_URL: postgres://postgres:postgres@postgres:5432/postgres
      DOCKET_TEST_NEO4J_URL: bolt://neo4j:7687
      DOCKET_TEST_NEO4J_PASSWORD: ci-neo4j-password
      DOCKET_TEST_NEO4J_B_URL: bolt://neo4j-b:7687
      DOCKET_TEST_NEO4J_B_PASSWORD: ci-neo4j-password-b
      DOCKET_TEST_QDRANT_URL: http://qdrant:6333
      DOCKET_TEST_QDRANT_API_KEY: ci-qdrant-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: platform-playwright-report
          path: |
            platform/playwright-report/
            platform/test-results/
          retention-days: 7

  # A maintained secret scanner over the whole history, with the repository's fixture allowlist (.gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner
