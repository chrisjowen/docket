resourceTypes:

  
  service:
    description: >
      Independently deployable or operated software capability.

    icon: server

    attributes:
      language:
        type: string

      lifecycle:
        type: string
        enum:
          - experimental
          - active
          - deprecated
          - retired

    extraction:
      instructions: >
        Capture a service when software has a distinct operational, deployment,
        or runtime lifecycle.

      clues:
        - service
        - API
        - backend
        - deployment
        - runtime

      doNotConfuseWith:
        - library
        - repository

  environment:
    description: >
      An execution or deployment environment.

    icon: globe

    attributes:
      environmentType:
        type: string
        enum:
          - local
          - dev
          - test
          - staging
          - production

    extraction:
      instructions: >
        Capture an environment when software is run or deployed into a named,
        durable context with its own configuration or data.

      clues:
        - environment
        - staging
        - production
        - deployed to
        - cluster

      doNotConfuseWith:
        - system
        - service

  datasource:
    description: >
      A source of information consumed by software or agents.

    icon: database

    attributes:
      zone:
        type: string
        enum:
          - public
          - private
          - restricted

    extraction:
      instructions: >
        Capture a datasource when data is read from a durable store, feed, or
        API that other resources depend on for information.

      clues:
        - database
        - data source
        - feed
        - warehouse
        - index

      doNotConfuseWith:
        - system
        - service

  team:
    description: >
      An organisational team responsible for resources.

    icon: users

    extraction:
      instructions: >
        Capture a team when a named group of people owns or operates resources.
        Capture the team, never an individual person.

      clues:
        - team
        - squad
        - owned by
        - on-call
        - responsible for

      doNotConfuseWith:
        - agent

  decision:
    description: >
      A durable technical or architectural decision.

    icon: gavel

    extraction:
      instructions: >
        Capture a decision only where a concrete choice has been made. Do not
        capture open questions as decisions.

      clues:
        - we decided
        - chose
        - instead of
        - going with
        - rejected

      doNotConfuseWith:
        - constraint

  constraint:
    description: >
      A meaningful durable limitation affecting architecture, implementation,
      deployment, security, operations, or development.

    icon: lock

    extraction:
      instructions: >
        Capture a constraint when a limitation is durable and shapes future
        work. A constraint is imposed; a decision is chosen.

      clues:
        - must not
        - cannot
        - limited to
        - required by
        - compliance

      doNotConfuseWith:
        - decision

  api:
    description: >
      An interface a service or agent exposes for others to call or subscribe to
      - an HTTP, GraphQL or gRPC API, a websocket protocol, or an event
      contract.

    icon: plug

    attributes:
      protocol:
        type: string
        enum:
          - rest
          - graphql
          - grpc
          - websocket
          - event
          - soap
          - other

      version:
        type: string

      spec:
        type: string
        description: Path or URL of the API's specification, e.g. an OpenAPI file.

    extraction:
      instructions: >
        Capture an API when other software, teams or customers depend on its
        shape - a published contract, a versioned endpoint family, a channel
        protocol. Capture the interface, not the service that implements it.

      clues:
        - API
        - endpoint
        - contract
        - OpenAPI
        - schema
        - channel

      doNotConfuseWith:
        - service
        - endpoint

relationships:

  # --- The original five: names and meaning unchanged, more types allowed ------

  owned_by:
    description: >
      Identifies the team responsible for a resource.

    from:
      - service
      - datasource
      - environment
      - api

    to:
      - team

  depends_on:
    description: >
      Represents a runtime, build, or operational dependency.

    from:
      - service
      - api

    to:
      - service
      - datasource
      - api

    attributes:
      criticality:
        type: string
        enum:
          - low
          - medium
          - high

      runtime:
        type: boolean

  uses:
    description: >
      Represents a resource consuming, invoking, or making use of another.

    from: "*"
    to: "*"

  supersedes:
    description: >
      Marks a decision - or a record, policy, document or API version - as
      replacing an earlier one.

    from:
      - decision
      - api

    to:
      - decision
      - api

  deployed_to:
    description: >
      Records where a resource runs. Spec §16 uses this relationship in its link
      examples, and without it the environment type has no inbound edge.

    from:
      - service

    to:
      - environment

  exposes:
    description: >
      A service or workload offers an API or is reachable at an endpoint.

    from:
      - service

    to:
      - api

  consumes:
    description: >
      A resource calls an API, reads from an event stream, or calls an endpoint
      it does not own.

    from:
      - service

    to:
      - api

  implements:
    description: >
      Software or work that delivers a requirement, feature or API.

    from:
      - service
      - api

    to:
      - api

  governs:
    description: >
      A policy, constraint or compliance requirement applies to a resource.

    from:
      - constraint

    to: "*"
