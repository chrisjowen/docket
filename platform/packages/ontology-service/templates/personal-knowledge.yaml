# Personal knowledge ontology.
#
# What an assistant should remember about a person's life and the people in
# it: who they know, the conversations they had, what happened, where, what
# they care about and what they are working towards. Remove what you never
# use, or extend it: adding a type here is all that is required, no CLI
# change. A type's `icon` names the Lucide icon (https://lucide.dev/icons)
# that `docket open` draws it with; see docs/SPEC.md for the icons docket
# bundles.
#
# Read this file before performing structured memory extraction.

version: 1

# --- Sources and trust ---------------------------------------------------------
#
# Every captured resource and link records where it was seen, as `evidence`
# entries naming one of the sources below and the exact location - the
# fields under a source's `locator`, or the common ones every source takes
# (repository, path, lines, symbol, key, method, endpoint, urls, commit).
# Confidence is computed from that evidence by the policies under `trust`,
# never written by hand:
#
#   - A `score` policy prices an observation: "when the source is X (about
#     type T, with attributes Y), it is worth S". The most specific matching
#     policy wins - naming the type counts one, each condition one - and a tie
#     goes to the lower score. With no match an observation is worth
#     `fallback`.
#   - An `adjust` policy moves that price up or down; every match applies.
#   - Observations of one source instance do not corroborate each other: the
#     strongest one counts. Independent sources combine, so a pod seen in code
#     (0.3) and running in the cluster (0.9) is 1 - 0.7 * 0.1 = 0.93, and
#     nothing goes above `cap`.
#   - A memory with no evidence takes its `provenance.confidence`, or
#     `unevidenced` when it has none.
#   - `bands` name how far a confidence goes: established, probable, and below
#     that unverified. `accept` is the score a supersede proposal needs before
#     it replaces the record, by the replaced record's type.
#
# Run `docket why <id>` to see which policies priced a resource.

sources:
  person:
    kind: identity
    description: >
      A person, as the people directory knows them: their role, team and
      flags. Evidence that cites no source is from the person the writer acts
      for; evidence naming someone else counts as the writer's person until
      that one confirms it with evidence of their own.
    attributes:
      role: { type: string, setBy: directory }
      team: { type: string, setBy: directory }
      flags: { type: "string[]", setBy: directory }

  human:
    description: >
      Legacy: stated by a person, as whoever wrote it said. Kept so evidence
      written before the person source scores as it did; a write that names
      human is recorded as person, scored by who that person is.

  conversation:
    description: >
      Said in a conversation - with the assistant or between people. Record the
      session and, in note, what was said.

  message:
    description: |
      A message, email or chat thread. Record a link to it, or its id as key.
    locator:
      urls: {}
      key: {}
    requiresAny: [ urls, key ]

  journal:
    description: |
      A journal entry, diary or note the person wrote. Record the file or URL.
    locator:
      path: {}
      urls: {}
    requiresAny: [ path, urls ]

  calendar:
    description: |
      A calendar entry. Record its URL or id as key.
    locator:
      urls: {}
      key: {}
    requiresAny: [ urls, key ]

  inferred:
    description: >
      Inferred by an assistant from other records rather than stated. Record in
      note what it was inferred from.

trust:
  unevidenced: 0.5
  fallback: 0.4
  cap: 0.99
  accept: { default: 0.75 }
  bands: { established: 0.8, probable: 0.5 }
  policies:
    - name: A person said so
      when: { source: person }
      score: 0.7
    - name: A lead said so
      when: { source: person, role: lead }
      score: 0.85
    - name: human evidence
      when: { source: human }
      score: 0.9
    - name: conversation evidence
      when: { source: conversation }
      score: 0.7
    - name: message evidence
      when: { source: message }
      score: 0.65
    - name: journal evidence
      when: { source: journal }
      score: 0.75
    - name: calendar evidence
      when: { source: calendar }
      score: 0.8
    - name: inferred evidence
      when: { source: inferred }
      score: 0.4

resourceTypes:

  person:
    description: >
      Someone in the person's life - family, a friend, a colleague,
      themselves.

    icon: user

    attributes:
      relationship:
        type: string
        description: How they relate to the person whose knowledge this is.

      birthday:
        type: string

    extraction:
      instructions: >
        Capture a person when someone is named with something worth
        remembering about them. Use their name as the title.

      clues:
        - friend
        - family
        - my
        - met

  conversation:
    description: >
      One conversation or chat session, with when it happened and what was
      covered.

    icon: message-square

    attributes:
      date:
        type: string

    extraction:
      instructions: >
        Capture a conversation when it is the source of what is remembered, so
        each memory can point back to when it was said.

      clues:
        - talked
        - chatted
        - said
        - told me

      doNotConfuseWith:
        - event

  event:
    description: >
      Something that happened or will happen - a trip, a party, a move, a
      milestone.

    icon: calendar

    attributes:
      date:
        type: string

    extraction:
      instructions: >
        Capture an event when something happened to or is planned by someone,
        with when it was.

      clues:
        - went to
        - attended
        - trip
        - birthday
        - moved

      doNotConfuseWith:
        - conversation

  note:
    description: >
      One remembered fact or observation about a person, a place or a
      preference.

    icon: file-text

    attributes:
      date:
        type: string

    extraction:
      instructions: >
        Capture a note for a single fact worth remembering, in one or two
        sentences, linked to who and what it is about.

      clues:
        - likes
        - prefers
        - remembers
        - mentioned

  place:
    description: >
      A place that matters - a home town, a favourite restaurant, a
      destination.

    icon: map

    extraction:
      instructions: >
        Capture a place when where something happened or someone lives matters.

      clues:
        - lives in
        - visited
        - from
        - near

  interest:
    description: >
      A hobby, passion or subject someone cares about.

    icon: star

    extraction:
      instructions: >
        Capture an interest when it recurs and would shape a recommendation or a
        conversation.

      clues:
        - hobby
        - loves
        - into
        - passionate about

  goal:
    description: >
      Something someone is working towards.

    icon: target

    attributes:
      status:
        type: string
        enum:
          - planned
          - active
          - achieved
          - dropped

    extraction:
      instructions: >
        Capture a goal when someone states an aim they are pursuing.

      clues:
        - wants to
        - plans to
        - goal
        - working towards

relationships:

  knows:
    description: >
      Two people know each other.

    from:
      - person

    to:
      - person

    attributes:
      as:
        type: string
        description: How - friend, sibling, colleague.

  participant_in:
    description: >
      Someone took part in a conversation or an event.

    from:
      - person

    to:
      - conversation
      - event

  about:
    description: >
      Who or what a note is about.

    from:
      - note

    to:
      - person
      - event
      - place
      - interest
      - goal

  recorded_in:
    description: >
      The conversation a note or event was learned in.

    from:
      - note
      - event

    to:
      - conversation

  happened_at:
    description: >
      Where an event happened.

    from:
      - event

    to:
      - place

  interested_in:
    description: >
      Someone cares about an interest.

    from:
      - person

    to:
      - interest

  pursues:
    description: >
      Someone is working towards a goal.

    from:
      - person

    to:
      - goal

  lives_in:
    description: >
      Where someone lives.

    from:
      - person

    to:
      - place
