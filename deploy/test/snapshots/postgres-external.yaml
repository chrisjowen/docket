---
# Source: docket/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docket
  labels:
    app.kubernetes.io/name: docket
    app.kubernetes.io/instance: docket
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: docket-0.15.0
    app.kubernetes.io/component: server
spec:
  # One server: it writes the docket on a ReadWriteOnce volume and keeps its state there.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: docket
      app.kubernetes.io/instance: docket
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docket
        app.kubernetes.io/instance: docket
        app.kubernetes.io/version: "0.15.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: docket-0.15.0
        app.kubernetes.io/component: server
      annotations:
        checksum/config: 21f8208eca76d6aa1f462fc41e4dee173449035eea9e7214bbcd7f88b0af0a60
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # The docket's directory and the server's, on a new volume. Not from the
        # image's working directory, /data/docket: the runtime would make it, as root.
        - name: dirs
          image: ghcr.io/chrisjowen/docket:0.15.0
          imagePullPolicy: IfNotPresent
          workingDir: /data
          command: [/nodejs/bin/node, -e, "for (const dir of ['/data/docket', '/data/state']) require('fs').mkdirSync(dir, { recursive: true })"]
          volumeMounts:
            - { name: data, mountPath: /data }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
        # Makes a docket on a new volume (`docket init`); leaves an existing one as it is.
        - name: init
          image: ghcr.io/chrisjowen/docket:0.15.0
          imagePullPolicy: IfNotPresent
          args: [init]
          workingDir: /data/docket
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: docket
          image: ghcr.io/chrisjowen/docket:0.15.0
          imagePullPolicy: IfNotPresent
          args: [serve]
          env:
            # Read by `docket serve` and by `kubectl exec … docket serve token …` alike.
            - { name: DOCKET_SERVE_CONFIG, value: /etc/docket/docket-server.yaml }
            - { name: DOCKET_TOKENS_FILE, value: /etc/docket/tokens/tokens.yaml }
            - name: DOCKET_DATABASE_URL
              valueFrom: { secretKeyRef: { name: docket-database, key: url } }
            - { name: DOCKET_DATABASE_SCHEMA, value: "public" }
            - { name: DOCKET_CODEC_KEY_FILE, value: /etc/docket/codec/codec.key }
          ports:
            - { name: http, containerPort: 4390 }
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /etc/docket/docket-server.yaml, subPath: docket-server.yaml, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: tokens, mountPath: /etc/docket/tokens, readOnly: true }
            - { name: codec, mountPath: /etc/docket/codec, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: docket
        - name: config
          configMap:
            name: docket
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        # Mounted whole, not by subPath, so an edit to the Secret reaches the pod.
        - name: tokens
          secret:
            secretName: docket-tokens
            defaultMode: 0440
        - name: codec
          secret:
            secretName: docket-codec
            defaultMode: 0440

---
# Source: docket/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docket
  labels:
    app.kubernetes.io/name: docket
    app.kubernetes.io/instance: docket
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: docket-0.15.0
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["docket.example.com"]
      secretName: docket-tls
  rules:
    - host: "docket.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docket
                port: { name: http }
