---
# Source: docket/templates/networkpolicies.yaml
# docket: its port, from whoever networkPolicy.from names (anyone, when empty).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docket
  labels:
    app.kubernetes.io/name: docket
    app.kubernetes.io/instance: docket
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: docket-0.15.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: docket
      app.kubernetes.io/instance: docket
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: http }
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx

---
# Source: docket/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: docket
  labels:
    app.kubernetes.io/name: docket
    app.kubernetes.io/instance: docket
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: docket-0.15.0
data:
  # docket serve's configuration (docs/self-hosting.md). Secrets are not here:
  # the database URL, the codec key and the tokens come from Secrets.
  docket-server.yaml: |
    dataDir: /data/state
    listen:
      host: 0.0.0.0
      port: 4390
    ontology:
      mcpWriters:
      - owner
    projections:
    - sqlite
    publicUrl: https://docket.example.com
    ui: true
    workspaces:
    - path: /data/docket
      slug: docket

---
# Source: docket/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: docket
  labels:
    app.kubernetes.io/name: docket
    app.kubernetes.io/instance: docket
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: docket-0.15.0
  annotations:
    # The docket itself: kept if the release is removed.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests: { storage: 5Gi }

