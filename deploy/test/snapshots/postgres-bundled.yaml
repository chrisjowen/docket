# Source: docket/templates/postgres.yaml
# A single Postgres for evaluation: no replicas, backups or failover. Run your
# own (postgres.external) for anything you would miss.

apiVersion: v1
kind: Secret
metadata:
  name: docket-postgres
  labels:
    app.kubernetes.io/name: docket
    app.kubernetes.io/instance: docket
    app.kubernetes.io/version: "0.14.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: docket-0.14.0
  annotations:
    # Kept if the release is removed, so a store's data stays readable.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: <generated>
---
# Source: docket/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: docket
  labels:
    app.kubernetes.io/name: docket
    app.kubernetes.io/instance: docket
    app.kubernetes.io/version: "0.14.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: docket-0.14.0
data:
  # docket serve's configuration (docs/self-hosting.md). Secrets are not here:
  # the database URL, the codec key and the tokens come from Secrets.
  docket-server.yaml: |
    dataDir: /data/state
    listen:
      host: 0.0.0.0
      port: 4390
    ontology:
      mcpWriters:
      - owner
    projections:
    - postgres
    - jsonl
    ui: true
    workspaces:
    - path: /data/docket
      slug: docket
---
