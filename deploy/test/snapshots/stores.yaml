        helm.sh/chart: docket-0.15.0
        app.kubernetes.io/component: neo4j
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 7474
        runAsGroup: 7474
        fsGroup: 7474
