            - { name: TELEMETRY_DISABLED, value: "true" }
            - { name: LLM_PROVIDER, value: "ollama" }
            - { name: LLM_MODEL, value: "qwen2.5:7b" }
            - { name: LLM_ENDPOINT, value: "http://docket-embedder:11434" }
