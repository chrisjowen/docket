---
# Source: docket/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: docket
  labels:
    app.kubernetes.io/name: docket
    app.kubernetes.io/instance: docket
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: docket-0.15.0
data:
  # docket serve's configuration (docs/self-hosting.md). Secrets are not here:
  # the database URL, the codec key and the tokens come from Secrets.
  docket-server.yaml: |
    ai:
      model: qwen2.5:7b
      provider: ollama
      url: http://docket-embedder:11434
    dataDir: /data/state
    listen:
      host: 0.0.0.0
      port: 4390
    ontology:
      mcpWriters:
      - owner
      - admin
    projections:
    - postgres
    - config:
        passwordEnv: NEO4J_PASSWORD
        url: bolt://docket-neo4j:7687
      id: graph
      module: '@docket/adapter-neo4j'
    ui: false
    workspaces:
    - path: /data/docket
      slug: docket

