# Source: docket/templates/embedder.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: docket-embedder
  labels:
    app.kubernetes.io/name: docket
    app.kubernetes.io/instance: docket
    app.kubernetes.io/version: "0.15.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: docket-0.15.0
    app.kubernetes.io/component: embedder
spec:
  replicas: 1
  serviceName: docket-embedder
  selector:
    matchLabels:
      app.kubernetes.io/name: docket
      app.kubernetes.io/instance: docket
      app.kubernetes.io/component: embedder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docket
        app.kubernetes.io/instance: docket
        app.kubernetes.io/version: "0.15.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: docket-0.15.0
        app.kubernetes.io/component: embedder
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ollama
          image: "ollama/ollama:0.40.14"
          imagePullPolicy: IfNotPresent
          # Serve, and pull the models onto the volume the first time.
          command: [/bin/sh, -c]
          args:
            - |
              ollama serve & server=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              for model in nomic-embed-text qwen2.5:7b; do ollama pull "$model"; done
              wait "$server"
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_MODELS, value: /models }
            - { name: OLLAMA_KEEP_ALIVE, value: "24h" }
            - { name: HOME, value: /tmp }
          ports:
            - { name: http, containerPort: 11434 }
          startupProbe:
            exec: { command: [ollama, show, "nomic-embed-text"] }
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            exec: { command: [ollama, show, "nomic-embed-text"] }
            periodSeconds: 20
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: [ollama, list] }
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: models, mountPath: /models }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }

