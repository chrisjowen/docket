    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: docket-0.15.0
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  serviceName: docket-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: docket
      app.kubernetes.io/instance: docket
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docket
        app.kubernetes.io/instance: docket
        app.kubernetes.io/version: "0.15.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: docket-0.15.0
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: "pgvector/pgvector:pg17"
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: docket }
            - { name: POSTGRES_DB, value: docket }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: docket-postgres, key: password } }
            # A directory under the volume's root, which may hold lost+found.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            exec: { command: [pg_isready, -U, docket, -d, docket] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: [pg_isready, -U, docket, -d, docket] }
            periodSeconds: 20
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 10Gi }

