apiVersion: v1
kind: Service
metadata:
  name: {{ include "docket.fullname" . }}
  labels:
    {{- include "docket.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "docket.selector" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
