<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">docket: a casebook of evidence for your repository</title>
  <desc id="desc">A manila case file labelled .docket/ lies open on a desk. Exhibit cards for a service, a team, a datasource and a constraint are pinned to a cork board and joined by red string labelled with relationships, and an EVIDENCE stamp marks the file.</desc>
  <defs>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#2b2118"/>
      <circle cx="1" cy="1" r="0.6" fill="#33281d"/>
      <circle cx="4" cy="4" r="0.5" fill="#251c14"/>
    </pattern>
    <pattern id="cork" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#b8865a"/>
      <circle cx="2" cy="3" r="1" fill="#a87649"/>
      <circle cx="7" cy="7" r="1.2" fill="#c49467"/>
      <circle cx="8" cy="2" r="0.7" fill="#9f6d42"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Desk -->
  <rect width="1200" height="400" fill="url(#grain)"/>

  <!-- Cork evidence board -->
  <g filter="url(#shadow)">
    <rect x="640" y="28" width="532" height="344" rx="6" fill="#5a3d25"/>
    <rect x="652" y="40" width="508" height="320" rx="3" fill="url(#cork)"/>
  </g>

  <!-- Red string between exhibits -->
  <g stroke="#b3261e" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M760 66 Q 876 120 992 62"/>
    <path d="M760 66 Q 770 160 804 234"/>
    <path d="M992 62 Q 1040 150 1064 236"/>
    <path d="M804 234 Q 934 300 1064 236"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#3b0d0a" font-weight="700">
    <text x="876" y="114" text-anchor="middle">owned_by</text>
    <text x="736" y="190" text-anchor="middle" transform="rotate(-78 736 190)">depends_on</text>
    <text x="1062" y="172" text-anchor="middle" transform="rotate(64 1062 172)">governs</text>
    <text x="934" y="292" text-anchor="middle">governs</text>
  </g>

  <!-- Exhibit cards -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g transform="rotate(-3 760 96)" filter="url(#shadow)">
      <rect x="690" y="62" width="150" height="74" fill="#fbf6e9"/>
      <text x="700" y="82" font-size="11" fill="#8a1c14" font-weight="700" letter-spacing="1">EXHIBIT A</text>
      <text x="700" y="102" font-size="12" fill="#1f1a14">service.orders</text>
      <text x="700" y="122" font-size="10" fill="#6b5d4a">confidence 0.93</text>
    </g>
    <g transform="rotate(2 980 92)" filter="url(#shadow)">
      <rect x="912" y="58" width="164" height="74" fill="#fbf6e9"/>
      <text x="922" y="78" font-size="11" fill="#8a1c14" font-weight="700" letter-spacing="1">EXHIBIT B</text>
      <text x="922" y="98" font-size="12" fill="#1f1a14">team.platform</text>
      <text x="922" y="118" font-size="10" fill="#6b5d4a">source: human</text>
    </g>
    <g transform="rotate(3 800 262)" filter="url(#shadow)">
      <rect x="712" y="230" width="184" height="74" fill="#fbf6e9"/>
      <text x="722" y="250" font-size="11" fill="#8a1c14" font-weight="700" letter-spacing="1">EXHIBIT C</text>
      <text x="722" y="270" font-size="12" fill="#1f1a14">datasource.orders-db</text>
      <text x="722" y="290" font-size="10" fill="#6b5d4a">source: manifest</text>
    </g>
    <g transform="rotate(-2 1078 262)" filter="url(#shadow)">
      <rect x="976" y="232" width="176" height="74" fill="#fbf6e9"/>
      <text x="986" y="252" font-size="11" fill="#8a1c14" font-weight="700" letter-spacing="1">EXHIBIT D</text>
      <text x="986" y="272" font-size="12" fill="#1f1a14">constraint.pci-scope</text>
      <text x="986" y="292" font-size="10" fill="#6b5d4a">source: docs</text>
    </g>
  </g>

  <!-- Push pins -->
  <g>
    <circle cx="760" cy="66" r="6" fill="#d33a2c" stroke="#7a1a12" stroke-width="1.5"/>
    <circle cx="992" cy="62" r="6" fill="#d33a2c" stroke="#7a1a12" stroke-width="1.5"/>
    <circle cx="804" cy="234" r="6" fill="#d33a2c" stroke="#7a1a12" stroke-width="1.5"/>
    <circle cx="1064" cy="236" r="6" fill="#d33a2c" stroke="#7a1a12" stroke-width="1.5"/>
  </g>

  <!-- Manila case file -->
  <g filter="url(#shadow)">
    <path d="M40 92 h150 l18 -26 h230 l18 26 h134 v270 h-550 z" fill="#c9a66b"/>
    <rect x="40" y="92" width="550" height="270" fill="#d8b97f"/>
    <text x="226" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4a3517" font-weight="700">CASE FILE · .docket/</text>
  </g>

  <!-- Document sheet in the file -->
  <g filter="url(#shadow)" transform="rotate(-1.5 330 230)">
    <rect x="70" y="112" width="380" height="236" fill="#fbf6e9"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f1a14">
      <text x="88" y="138" fill="#8a7a62">---</text>
      <text x="88" y="158"><tspan fill="#8a1c14">id:</tspan> service.orders</text>
      <text x="88" y="178"><tspan fill="#8a1c14">type:</tspan> service</text>
      <text x="88" y="198"><tspan fill="#8a1c14">links:</tspan></text>
      <text x="104" y="218">- <tspan fill="#8a1c14">rel:</tspan> depends_on</text>
      <text x="118" y="238"><tspan fill="#8a1c14">target:</tspan> datasource.orders-db</text>
      <text x="118" y="258"><tspan fill="#8a1c14">evidence:</tspan></text>
      <text x="132" y="278">- <tspan fill="#8a1c14">source:</tspan> manifest</text>
      <text x="146" y="298"><tspan fill="#8a1c14">path:</tspan> package.json</text>
      <text x="88" y="322" fill="#8a7a62">---</text>
    </g>
  </g>

  <!-- EVIDENCE stamp -->
  <g transform="rotate(-14 500 300)" opacity="0.88">
    <rect x="404" y="270" width="196" height="58" rx="6" fill="none" stroke="#b3261e" stroke-width="4"/>
    <rect x="411" y="277" width="182" height="44" rx="3" fill="none" stroke="#b3261e" stroke-width="1.5"/>
    <text x="502" y="309" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" letter-spacing="4" fill="#b3261e">EVIDENCE</text>
  </g>

</svg>
